name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: macOS app (swift build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.swift') }}
      - name: Build Clipper.app (debug, native arch)
        run: scripts/build-macos.sh --debug
      - name: Smoke-test bundle
        run: |
          test -x dist/Clipper.app/Contents/MacOS/Clipper
          plutil -lint dist/Clipper.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Clipper.app
          ls dist/Clipper.app/Contents/Resources

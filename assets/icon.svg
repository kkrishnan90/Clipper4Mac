<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Deliberately built from flat shapes only (no gradients / filters) so it
    renders identically in every SVG engine, including ImageMagick's MSVG.
  -->
  <!-- macOS squircle base -->
  <path d="M512 64C214 64 64 214 64 512s150 448 448 448 448-150 448-448S810 64 512 64z" fill="#5B4BEB"/>
  <!-- faux gradient: soft highlight top-left, deep violet bottom-right -->
  <ellipse cx="330" cy="290" rx="470" ry="380" fill="#8B6CFF" fill-opacity="0.55"/>
  <ellipse cx="760" cy="820" rx="480" ry="360" fill="#C0399C" fill-opacity="0.45"/>
  <ellipse cx="220" cy="150" rx="330" ry="220" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- re-mask to the squircle by painting the outside again -->
  <path d="M0 0h1024v1024H0z M512 64C214 64 64 214 64 512s150 448 448 448 448-150 448-448S810 64 512 64z" fill="#000" fill-opacity="0" fill-rule="evenodd"/>

  <!-- board shadow -->
  <rect x="268" y="262" width="488" height="600" rx="72" fill="#1B1340" fill-opacity="0.30"/>
  <!-- board -->
  <rect x="268" y="236" width="488" height="600" rx="72" fill="#FFFFFF"/>
  <rect x="268" y="236" width="488" height="300" rx="72" fill="#F3F1FF"/>
  <rect x="268" y="440" width="488" height="120" fill="#FFFFFF"/>

  <!-- clip -->
  <rect x="392" y="196" width="240" height="120" rx="44" fill="#1B1340"/>
  <rect x="396" y="200" width="232" height="112" rx="40" fill="#2A1F63"/>
  <circle cx="512" cy="240" r="26" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- text lines -->
  <rect x="356" y="420" width="312" height="40" rx="20" fill="#5B4BEB" fill-opacity="0.90"/>
  <rect x="356" y="512" width="236" height="40" rx="20" fill="#8B6CFF" fill-opacity="0.80"/>
  <rect x="356" y="604" width="276" height="40" rx="20" fill="#E0479E" fill-opacity="0.70"/>

  <!-- lightning accent -->
  <path d="M706 552l-100 156h68l-32 126 126-178h-72l42-104z" fill="#1B1340" fill-opacity="0.25" transform="translate(4 8)"/>
  <path d="M706 552l-100 156h68l-32 126 126-178h-72l42-104z" fill="#FFD166"/>
</svg>

[package]
name = "uniffi-bindgen"
description = "Generates the Swift bindings for clipper-ffi (`cargo run -p uniffi-bindgen -- --help`)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

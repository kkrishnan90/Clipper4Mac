[workspace]
resolver = "2"
members = ["crates/clipper-core", "crates/clipper-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Krishnan <k.krishnan.90@gmail.com>"]
repository = "https://github.com/kkrishnan90/Clipper4Mac"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"
uniffi = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Image decoding is painfully slow in debug builds; always optimise it.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
